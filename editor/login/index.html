<!doctype html>
<html lang="ja">
  <head>
    <script src="/analytics-init.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
    <link rel="icon" href="/icon/favicon-20260605.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon/favicon-20260605.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon-20260605.png" />
    <meta name="robots" content="noindex,nofollow" />
    <title>編集ページログイン</title>
    <style>
      @font-face {
        font-family: "Noto Sans JP";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src:
          url("/fonts/NotoSansJP-VariableFont_wght.ttf") format("truetype-variations"),
          url("/fonts/NotoSansJP-VariableFont_wght.ttf") format("truetype");
      }

      /* Standalone page (no shared stylesheet): the few tokens it needs,
         mirroring src/styles/tokens.css. Flat: rules and whitespace only. */
      :root {
        --c-bg: #ffffff;
        --c-ink: #111111;
        --c-ink-2: #555555;
        --c-ink-3: #8c8c8c;
        --c-line: #e2e2df;
        --c-accent: #991c27;
        --c-accent-hover: #7e1620;
        --c-on-accent: #ffffff;
        --c-danger: #b42318;
        --font-sans:
          "Inter", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic", system-ui, sans-serif;
        --font-latin: "Inter", system-ui, sans-serif;
        --gutter: 24px;
        --radius-control: 4px;
        --ease: cubic-bezier(0.2, 0, 0, 1);
        --dur: 160ms;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(clamp(48px, 16vh, 144px), env(safe-area-inset-top, 0px))
          var(--gutter)
          max(48px, env(safe-area-inset-bottom, 0px));
        background: var(--c-bg);
        color: var(--c-ink);
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        line-height: 1.55;
        font-feature-settings: "palt" 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      :focus-visible {
        outline: 2px solid var(--c-accent);
        outline-offset: 2px;
      }

      .login-card {
        display: block;
        width: min(100%, 440px);
        margin-inline: auto;
      }

      .login-eyebrow {
        margin: 0 0 12px;
        color: var(--c-ink-3);
        font-family: var(--font-latin);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .login-top-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--c-ink);
      }

      .login-title {
        margin: 0;
        font-size: clamp(1.5rem, 1.2rem + 1.2vw, 1.875rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.3;
      }

      .login-form {
        display: grid;
        gap: 8px;
        padding-top: 24px;
      }

      .login-label {
        color: var(--c-ink-2);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .login-input {
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--c-ink-3);
        border-radius: var(--radius-control);
        background: var(--c-bg);
        color: var(--c-ink);
        font: inherit;
        transition: border-color var(--dur) var(--ease);
      }

      .login-input:hover,
      .login-input:focus {
        border-color: var(--c-ink);
      }

      .login-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }

      .login-submit,
      .login-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--c-ink);
        border-radius: var(--radius-control);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.2;
        text-decoration: none;
        transition:
          background-color var(--dur) var(--ease),
          border-color var(--dur) var(--ease),
          color var(--dur) var(--ease);
      }

      .login-submit {
        border-color: var(--c-accent);
        background: var(--c-accent);
        color: var(--c-on-accent);
        cursor: pointer;
      }

      .login-submit:not(:disabled):hover {
        border-color: var(--c-accent-hover);
        background: var(--c-accent-hover);
      }

      .login-submit:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .login-link {
        border-color: var(--c-line);
        background: transparent;
        color: var(--c-ink);
      }

      .login-link:hover {
        border-color: var(--c-ink);
      }

      .login-error {
        min-height: 1.4em;
        margin: 8px 0 0;
        color: var(--c-danger);
        font-size: 0.8125rem;
      }

      .lang-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        margin-top: 2px;
        padding: 0 2px;
        border: 0;
        background: transparent;
        color: var(--c-ink-3);
        cursor: pointer;
        font-family: var(--font-latin);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .lang-toggle-option {
        color: var(--c-ink-3);
        transition: color var(--dur) var(--ease);
      }

      .lang-toggle-option.is-active {
        color: var(--c-ink);
      }

      .lang-toggle-separator {
        color: var(--c-line);
      }

      @media (hover: hover) {
        .lang-toggle-option:not(.is-active):hover {
          color: var(--c-ink);
        }
      }

      @media (max-width: 720px) {
        :root {
          --gutter: 16px;
        }

        .login-submit,
        .login-link {
          flex: 1 1 auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
    <script>
      const isFileMode = window.location.protocol === 'file:';
      const EDITOR_AUTH_STORAGE_KEY = 'rits-oic-map-editor-auth-v1';
      const EDITOR_PASSWORD_HASH = '28938b7634b78374faa952fc48e30ecb9336ec498a7e3351e56ee4b5db4d489c';

      function resolveNextPath() {
        const next = new URLSearchParams(window.location.search).get('next');
        return next && next.startsWith('/') ? next : '/editor/';
      }

      async function sha256Hex(value) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, '0'))
          .join('');
      }

      if (isFileMode) {
        document.addEventListener('DOMContentLoaded', () => {
          const normalizeLang = (value) => {
            const lang = String(value ?? '').trim().toLowerCase();
            if (lang === 'ja' || lang.startsWith('ja-')) return 'ja';
            if (lang === 'en' || lang.startsWith('en-')) return 'en';
            return null;
          };
          const readBrowserLang = () => {
            const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
            return languages.map(normalizeLang).find(Boolean) ?? 'ja';
          };
          const lang = normalizeLang(localStorage.getItem('oicmap:lang')) ?? readBrowserLang();
          const fileModeText = {
            ja: {
              title: '編集ページログイン',
              copy:
                'このログイン画面はローカルサーバー経由で開く必要があります。<code>npm run dev</code> のあと <code>http://127.0.0.1:5173/editor/login/</code> を開いてください。'
            },
            en: {
              title: 'Editor Login',
              copy:
                'This login page must be opened through a local server. After running <code>npm run dev</code>, open <code>http://127.0.0.1:5173/editor/login/</code>.'
            }
          }[lang];

          document.documentElement.lang = lang;
          document.body.innerHTML = `
            <main style="max-width:640px;margin:0 auto;font-family:'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;color:#111111;">
              <section style="padding-top:24px;border-top:1px solid #111111;">
                <h1 style="margin:0 0 16px;font-size:1.75rem;font-weight:700;letter-spacing:0.02em;">${fileModeText.title}</h1>
                <p style="margin:0;line-height:1.8;">${fileModeText.copy}</p>
              </section>
            </main>
          `;
        });
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          const nextPath = resolveNextPath();
          const form = document.querySelector('#editor-login-form');
          const passwordInput = document.querySelector('#editor-login-password');
          const errorMessage = document.querySelector('#editor-login-error');
          const submitButton = document.querySelector('#editor-login-submit');

          if (sessionStorage.getItem(EDITOR_AUTH_STORAGE_KEY) === 'granted') {
            window.location.replace(nextPath);
            return;
          }

          form?.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!passwordInput || !errorMessage || !submitButton) {
              return;
            }

            errorMessage.textContent = '';
            submitButton.disabled = true;

            try {
              const passwordHash = await sha256Hex(passwordInput.value);

              if (passwordHash !== EDITOR_PASSWORD_HASH) {
                errorMessage.textContent = window.OIC_I18N?.t('login.error.incorrect') ?? 'パスワードが違います。';
                passwordInput.select();
                return;
              }

              sessionStorage.setItem(EDITOR_AUTH_STORAGE_KEY, 'granted');
              passwordInput.value = '';
              window.location.replace(nextPath);
            } finally {
              submitButton.disabled = false;
            }
          });

          passwordInput?.focus();
        });
      }
    </script>
    <script type="module" src="/src/i18n.js"></script>
  </head>
  <body data-app-mode="login">
    <main class="login-card" aria-label="編集ページログイン" data-i18n-aria="login.aria">
      <p class="login-eyebrow">EDITOR ACCESS</p>
      <div class="login-top-row">
        <h1 class="login-title" data-i18n="login.title">編集ページにログイン</h1>
        <button class="lang-toggle" data-lang-toggle type="button" aria-label="英語に切り替え">EN</button>
      </div>
      <form id="editor-login-form" class="login-form">
        <label class="login-label" for="editor-login-password" data-i18n="login.password">パスワード</label>
        <input
          id="editor-login-password"
          class="login-input"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <div class="login-actions">
          <button id="editor-login-submit" class="login-submit" type="submit" data-i18n="login.submit">ログイン</button>
          <a class="login-link" href="/" data-i18n="login.back">閲覧用サイトへ戻る</a>
        </div>
        <p id="editor-login-error" class="login-error" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
