    <main id="main" class="page timetable-main" aria-labelledby="timetable-title">

        <header class="page-head">
          <p class="page-eyebrow">Timetable</p>
          <h1 id="timetable-title" class="page-title">キャンパス周辺 時刻表</h1>

        <section class="section timetable-live-status" data-live-service-status aria-labelledby="live-status-title" aria-live="polite"></section>

        <section class="timetable-board" aria-labelledby="board-title">
          <div class="timetable-board-head">
            <div class="section-head">
              <p class="section-eyebrow">Departures</p>
              <h2 id="board-title" class="section-title">発車時刻</h2>
            </div>
            <button class="btn btn-quiet" type="button" data-reset-layout>初期順に戻す</button>
          </div>
          <div class="timetable-card-grid" data-card-grid></div>
        </section>

        <section class="section timetable-hidden-panel" aria-labelledby="hidden-title">
          <div class="section-head">
            <p class="section-eyebrow">Hidden</p>
            <h2 id="hidden-title" class="section-title">非表示カード</h2>
            <p class="meta-text" data-hidden-count>0件</p>
          </div>
          <div class="section-body">
            <div class="timetable-hidden-list" data-hidden-list>
              <p class="timetable-empty">非表示にしたカードはありません。</p>
            </div>
            <div class="timetable-controls">
              <button class="btn btn-quiet" type="button" data-show-all>すべて表示</button>
            </div>
          </div>
        </section>

        <section class="section timetable-source-note" data-source-note aria-labelledby="source-note-title"></section>
